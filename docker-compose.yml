version: "3.8"

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - COGNO_URI=${COGNO_URI}
      - COGNO_USER=${COGNO_USER:-cognodb}
      - COGNO_PASSWORD=${COGNO_PASSWORD}
      - PORT=3001
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - ./api:/app
      - /app/node_modules
    command: npm run start:prod
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    command: npm run start
    restart: unless-stopped
